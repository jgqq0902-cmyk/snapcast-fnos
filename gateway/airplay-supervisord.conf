[supervisord]
nodaemon=true
logfile=/app/data/airplay-supervisord.log
logfile_maxbytes=0
pidfile=/app/data/airplay-supervisord.pid

[program:dbus]
command=/usr/bin/dbus-daemon --session
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:avahi]
command=/bin/sh -c 'sleep 1; exec /usr/sbin/avahi-daemon --no-drop-root'
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:shairport]
command=/bin/sh -c 'sleep 2; exec /usr/local/bin/shairport-sync --name=Snapcast-AirPlay --output=stdout --port=5000 >/app/data/airplayfifo'
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
