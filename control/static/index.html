<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta id="themeColor" name="theme-color" content="#171312">
  <title>Snap / Room</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='25' fill='%23d18a59'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23171312'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/tokens.css?v=20260925-auditv3">
  <link rel="stylesheet" href="/styles/base.css?v=20260923-dual1">
  <link rel="stylesheet" href="/styles/layout.css?v=20260925-auditv3">
  <link rel="stylesheet" href="/styles/components.css?v=20260923-dual1">
  <link rel="stylesheet" href="/styles/rooms.css?v=20260925-auditv3">
  <link rel="stylesheet" href="/styles/device-console.css?v=20260923-dual1">
  <link rel="stylesheet" href="/styles/player.css?v=20260925-auditv3">
  <link rel="stylesheet" href="/styles/responsive.css?v=20260925-auditv3">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="app-shell device-shell">
    <main class="workspace">
      <section class="view active" data-page="devices">
        <header class="page-header console-header">
          <a class="brand console-brand" href="#devices" aria-label="Snap / Room 首页"><span class="brand-disc"></span><b>SNAP</b><i>/</i>ROOM</a>
          <div class="header-actions">
            <details class="system-health" id="systemHealth"><summary><i id="healthLamp"></i><span id="healthText">正在连接</span></summary><div><p><span>Snapserver</span><b id="healthSnapserver">检查中</b></p><p><span>MPD</span><b id="healthMpd">检查中</b></p><p><span>myMPD</span><b id="healthMympd">检查中</b></p></div></details>
            <button class="icon-btn" id="refreshRooms" aria-label="刷新状态"><svg><use href="/icons.svg#icon-reset"/></svg></button>
            <button class="logout-btn" id="logoutButton" aria-label="退出登录"><svg><use href="/icons.svg#icon-logout"/></svg></button>
          </div>
          <span id="deviceCount" hidden>0</span><span id="gatewayName" hidden></span><span id="accountState" hidden></span>
        </header>
        <div id="dashboard" class="dashboard" aria-live="polite" aria-busy="true">
          <section class="lightfield-player embedded-player active" id="playerPanel" aria-label="播放器">
            <div class="player-aurora" aria-hidden="true"><i></i><i></i><i></i></div>
            <header class="player-toolbar lightfield-toolbar"><span class="engine-state" id="playerEngineState"><i></i><span>正在连接</span></span></header>
            <div class="player-layout">
              <nav class="player-tabs" aria-label="播放器内容"><button class="active" data-player-view="now"><svg><use href="/icons.svg#icon-play-filled"/></svg><span>播放</span></button><button data-player-view="queue"><svg><use href="/icons.svg#icon-queue"/></svg><span>队列</span></button><button data-player-view="playlists"><svg><use href="/icons.svg#icon-playlist"/></svg><span>歌单</span></button><button data-player-view="radio"><svg><use href="/icons.svg#icon-radio"/></svg><span>电台</span></button><button data-player-view="library"><svg><use href="/icons.svg#icon-library"/></svg><span>曲库</span></button></nav>
              <aside class="player-now" id="playerNow"><div class="cover-orbit"><div class="cover-shell"><img id="playerCover" src="/art/album-placeholder.svg" alt="当前封面"><span class="cover-groove"></span></div></div><div class="player-track-copy"><small id="playerOrigin">本地播放器</small><h1 id="playerTitle">等待播放</h1><p id="playerArtist">从曲库、歌单或网络电台开始</p></div><div class="player-timeline"><input id="playerSeek" type="range" min="0" max="1" value="0" aria-label="播放进度"><div><time id="playerElapsed">0:00</time><time id="playerDuration">--:--</time></div></div><div class="transport" aria-label="播放控制"><button data-player-action="prev" aria-label="上一首"><svg><use href="/icons.svg#icon-previous"/></svg></button><button class="transport-main" data-player-action="toggle" aria-label="播放或暂停"><svg><use id="playerToggleIcon" href="/icons.svg#icon-play-filled"/></svg></button><button data-player-action="next" aria-label="下一首"><svg><use href="/icons.svg#icon-next"/></svg></button><button data-player-action="stop" aria-label="停止"><svg><use href="/icons.svg#icon-stop"/></svg></button></div><details class="player-volume-popover"><summary aria-label="调节播放器音量" title="音量"><svg><use href="/icons.svg#icon-volume"/></svg></summary><label><input id="playerVolume" type="range" min="0" max="100" value="0" aria-label="播放器音量"><output id="playerVolumeValue">0</output></label></details></aside>
              <section class="player-browser"><header class="player-content-head"><div><small id="playerViewEyebrow">UP NEXT</small><h2 id="playerViewTitle">播放队列</h2></div><label class="player-search"><svg><use href="/icons.svg#icon-search"/></svg><input id="playerSearch" type="search" placeholder="搜索曲目、歌手或专辑" aria-label="搜索播放器内容" hidden></label></header><div class="player-content" id="playerContent" aria-live="polite" aria-busy="true"><div class="player-loading"><span></span><b>正在读取音乐引擎</b></div></div></section>
            </div>
          </section>
          <div id="devicePanelHost"><section class="state-panel is-loading"><svg class="state-mark" aria-hidden="true"><use href="/icons.svg#icon-speaker"/></svg></section></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="loginDialog" class="modal" data-static aria-labelledby="loginTitle" aria-describedby="loginHint"><form class="dialog-card login-card" id="loginForm"><span class="brand-disc large" aria-hidden="true"></span><small>SNAP / ROOM</small><h2 id="loginTitle">登录控制台</h2><p id="loginHint">请输入本地管理员凭据</p><label><span>用户名</span><input id="loginUsername" autocomplete="username" required></label><label><span>密码</span><input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="accent-btn">登录</button></form></dialog>
  <dialog id="confirmDialog" class="modal" aria-labelledby="confirmTitle" aria-describedby="confirmMessage"><form class="dialog-card compact-dialog" id="confirmForm"><h2 id="confirmTitle">请确认</h2><p id="confirmMessage"></p><div class="dialog-actions"><button type="button" class="secondary" data-close-dialog>取消</button><button class="danger-action">确认</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js?v=20260925-auditv3"></script>
</body>
</html>
