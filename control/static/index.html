<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171312">
  <title>Snap / Room</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='25' fill='%23d18a59'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23171312'/%3E%3C/svg%3E"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/refinements.css">
</head>
<body><div class="atmosphere" aria-hidden="true"></div><div class="app-shell">
  <aside class="sidebar"><a class="brand" href="#snapcast"><span class="brand-disc"></span><b>SNAP</b><i>/</i>ROOM</a>
    <nav class="primary-nav" aria-label="主功能">
      <button class="active" data-tab="snapcast"><svg><use href="/icons.svg#icon-speaker"/></svg><span>设备</span></button>
      <button data-tab="queue"><svg><use href="/icons.svg#icon-queue"/></svg><span>队列</span><em id="queueCount">0</em></button>
      <button data-tab="playlists"><svg><use href="/icons.svg#icon-playlist"/></svg><span>歌单</span><em id="playlistCount">0</em></button>
      <button data-tab="library"><svg><use href="/icons.svg#icon-library"/></svg><span>曲库</span><em id="libraryCount">0</em></button>
    </nav><div class="connection"><span id="healthLamp"></span><div><b id="healthText">正在连接</b><small>192.168.2.125</small></div></div>
  </aside>
  <main class="workspace">
    <section class="view active" data-panel="snapcast"><header class="page-header"><div><p>LISTENING ROOMS</p><h1>设备</h1></div><button class="icon-btn" id="refreshRooms" aria-label="刷新设备"><svg><use href="/icons.svg#icon-refresh"/></svg></button></header><div class="source-stage"><div><small>当前音源</small><h2 id="activeSourceName">Default</h2><p id="activeSourceState">正在读取音源状态</p></div><div id="sourceList" class="source-list"></div></div><div id="speakerList" class="speaker-grid"></div></section>
    <section class="view" data-panel="queue"><header class="page-header"><div><p>UP NEXT</p><h1>播放队列</h1></div><div class="toolbar"><button class="icon-btn toggle-btn" id="random" aria-label="随机播放"><svg><use href="/icons.svg#icon-shuffle"/></svg></button><button class="icon-btn toggle-btn" id="repeat" aria-label="循环播放"><svg><use href="/icons.svg#icon-repeat"/></svg></button><button class="icon-btn danger" id="clearQueue" aria-label="清空队列"><svg><use href="/icons.svg#icon-trash"/></svg><span class="fallback">×</span></button></div></header><div class="save-strip"><input id="playlistName" maxlength="80" placeholder="将当前队列保存为…"><button id="savePlaylist"><svg><use href="/icons.svg#icon-save"/></svg>保存</button></div><div id="queueList" class="track-list"></div></section>
    <section class="view" data-panel="playlists"><header class="page-header"><div><p>COLLECTIONS</p><h1>歌单</h1></div><button class="accent-btn" id="importPlaylistButton"><svg><use href="/icons.svg#icon-import"/></svg>导入歌单</button></header><input id="playlistFile" type="file" accept=".m3u,.m3u8,.pls" hidden><div class="playlist-browser"><nav id="playlistTabs" class="playlist-tabs" aria-label="歌单列表"></nav><section class="playlist-sheet"><header class="playlist-sheet-head"><div><small>PLAYLIST</small><h2 id="playlistPageTitle">请选择歌单</h2></div><div id="playlistPageActions" class="dialog-actions"></div></header><div id="playlistPageTracks" class="track-list"><p class="empty">暂无歌单，导入或从队列保存一个</p></div></section></div></section>
    <section class="view" data-panel="library"><header class="page-header"><div><p>YOUR MUSIC</p><h1>本地曲库</h1></div><button class="icon-btn" id="scanButton" aria-label="扫描曲库"><svg><use href="/icons.svg#icon-refresh"/></svg></button></header><div class="library-bar"><div class="view-switch" role="tablist"><button class="active" data-library-view="albums">专辑</button><button data-library-view="artists">歌手</button><button data-library-view="tracks">曲目</button><button data-library-view="folders">文件夹</button></div><label class="search-box"><svg><use href="/icons.svg#icon-search"/></svg><input id="search" type="search" placeholder="搜索曲库"></label><label class="page-size"><span>每页</span><select id="pageSize"><option>10</option><option>20</option><option>50</option><option>100</option></select></label></div><div id="folderTrail" class="breadcrumbs" hidden></div><div id="libraryList" class="library-content" aria-live="polite"></div><nav class="pager"><button id="prevPage" aria-label="上一页"><svg><use href="/icons.svg#icon-back"/></svg></button><span id="pageInfo">1 / 1</span><button id="nextPage" aria-label="下一页"><svg><use href="/icons.svg#icon-chevron-right"/></svg></button></nav><details class="library-settings"><summary><svg><use href="/icons.svg#icon-folder"/></svg>曲库目录</summary><form id="libraryForm"><div class="path-field"><span>/vol1/1000/</span><input id="libraryPath" list="libraryPaths" required></div><datalist id="libraryPaths"></datalist><button>保存并扫描</button></form></details></section>
  </main>
  <aside class="now-playing" id="nowPlayingPanel"><button class="icon-btn close-player" id="closePlayer" aria-label="收起播放器"><svg><use href="/icons.svg#icon-collapse"/></svg></button><div class="hero-art art" id="heroArt"><span>SR</span></div><div class="now-copy"><small id="playSourceLabel">LOCAL / DLNA</small><h2 id="drawerTitle">未播放</h2><p id="drawerMeta">选择一首本地音乐</p></div><div id="lyrics" class="lyrics"><p>歌词将在这里显示</p></div></aside>
  <footer class="mini-player" id="miniPlayer"><button class="mini-info" id="openPlayer"><span class="mini-art art" id="miniArt"><i>SR</i></span><span><b id="trackTitle">未播放</b><small id="trackMeta">LOCAL / DLNA</small></span></button><div class="transport"><button class="icon-btn" data-action="previous" aria-label="上一首"><svg><use href="/icons.svg#icon-previous"/></svg></button><button class="play-btn" data-action="toggle" id="playToggle" aria-label="播放"><svg><use href="/icons.svg#icon-play-filled"/></svg></button><button class="icon-btn" data-action="next" aria-label="下一首"><svg><use href="/icons.svg#icon-next"/></svg></button></div><div class="progress-cluster"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1" value="0"><span id="duration">0:00</span></div><label class="master-volume"><button type="button" class="icon-btn" id="playerMute" aria-label="静音"><svg><use href="/icons.svg#icon-volume"/></svg></button><input id="playerVolume" type="range" min="0" max="100"><output id="playerVolumeValue">--</output></label></footer>
</div>
<dialog id="importDialog"><div class="dialog-card"><header><div><small>IMPORT</small><h2>导入歌单</h2></div><button class="icon-btn" data-close-dialog aria-label="关闭"><svg><use href="/icons.svg#icon-close"/></svg></button></header><button class="upload-tile" id="chooseLocalPlaylist"><svg><use href="/icons.svg#icon-import"/></svg><b>选择电脑中的歌单</b><span>M3U · M3U8 · PLS，最大 1 MB</span></button><section class="server-import"><header><b>FNOS 中的歌单</b><button class="icon-btn" id="refreshPlaylistFiles" aria-label="刷新"><svg><use href="/icons.svg#icon-refresh"/></svg></button></header><div id="serverPlaylistList"><p class="empty">正在扫描…</p></div></section></div></dialog>
<dialog id="detailDialog"><div class="dialog-card detail-card"><header><div><small id="detailEyebrow">DETAIL</small><h2 id="detailTitle">详情</h2></div><button class="icon-btn" data-close-dialog aria-label="关闭"><svg><use href="/icons.svg#icon-close"/></svg></button></header><div id="detailBody"></div></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="/app.js"></script></body></html>
