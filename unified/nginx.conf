worker_processes 1;
pid /app/data/nginx.pid;
error_log /app/data/nginx/logs/error.log warn;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path /app/data/nginx/client_body;
    proxy_temp_path /app/data/nginx/proxy;
    fastcgi_temp_path /app/data/nginx/fastcgi;
    uwsgi_temp_path /app/data/nginx/uwsgi;
    scgi_temp_path /app/data/nginx/scgi;
    server_tokens off;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    limit_req_zone $binary_remote_addr zone=login_limit:1m rate=5r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen __WEB_PORT____TLS_LISTEN__;
__TLS_CERT__
__TLS_KEY__
__TLS_PROTOCOLS__

        location = /api/login {
            limit_req zone=login_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:__CONTROL_PORT__;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /_session_check {
            internal;
            proxy_pass http://127.0.0.1:__CONTROL_PORT__/api/session-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /player/ {
            auth_request /_session_check;
            proxy_pass http://127.0.0.1:__MYMPD_PORT__/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /player;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:__CONTROL_PORT__;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
