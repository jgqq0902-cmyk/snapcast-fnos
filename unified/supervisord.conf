[supervisord]
nodaemon=true
logfile=/app/data/unified-supervisord.log
logfile_maxbytes=0
pidfile=/app/data/unified-supervisord.pid

[program:snapserver]
command=/app/unified/snapserver-entrypoint.sh
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0
[program:dbus]
command=/usr/bin/dbus-daemon --session
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:avahi]
command=/bin/sh -c 'sleep 1; exec /usr/sbin/avahi-daemon --no-drop-root --file=/app/unified/avahi-daemon.conf'
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=20
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:shairport]
command=/app/unified/shairport-entrypoint.sh
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:mpd]
command=/bin/sh -c 'while [ ! -p /app/data/dlnafifo ]; do sleep 1; done; exec /usr/bin/mpd --no-daemon /app/unified/mpd.conf'
umask=0022
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:upmpdcli]
command=/app/unified/upmpdcli-entrypoint.sh
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=55
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:dlna-relay]
command=/usr/bin/python3 /app/unified/dlna_relay.py
environment=DLNA_RELAY_HTTP_PORT="1790",DLNA_RELAY_MPD_PORT="6601",DLNA_RELAY_UPSTREAM_MPD_PORT="6600",DLNA_RELAY_MAX_RETRIES="10",DLNA_RELAY_READ_TIMEOUT="20"
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=45
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:mympd]
command=/bin/sh -c 'while [ ! -S /app/data/dlna/mpd.sock ]; do sleep 1; done; exec /app/unified/mympd-init.sh'
# myMPD must use TCP for native webradio favorites. With a Unix socket it
# cannot resolve mympd://webradio/... to the configured HTTP callback URI and
# MPD reports "No such playlist".
environment=MPD_HOST="127.0.0.1",MPD_PORT="6600",MYMPD_LOGLEVEL="4",MYMPD_SCRIPTS_EXTERNAL="false",MYMPD_STICKERS="false",MYMPD_WEBRADIODB="false"
umask=0022
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=45
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:radio-import]
command=/usr/bin/python3 /app/unified/import-mympd-radios.py --endpoint http://127.0.0.1:%(ENV_MYMPD_INTERNAL_PORT)s/api/default
autostart=true
autorestart=false
startsecs=0
startretries=0
priority=55
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:control]
command=/usr/bin/python3 /app/control/app.py
environment=CONTROL_HOST="127.0.0.1",CONTROL_PORT="%(ENV_CONTROL_INTERNAL_PORT)s",CONTROL_SECURE_COOKIE="%(ENV_CONTROL_SECURE_COOKIE)s",SNAPSERVER_RPC_URL="http://127.0.0.1:1780/jsonrpc",SNAPSERVER_RPC_PORT="1705",MPD_SOCKET="/app/data/dlna/mpd.sock",AIRPLAY_STOP_HELPER="/app/unified/drop-airplay-session.sh"
umask=0022
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=50
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -p /app/data/nginx -c /app/data/nginx.conf -g 'daemon off;'
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=60
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/service-logs/%(program_name)s.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/data/service-logs/%(program_name)s.stderr.log
stderr_logfile_maxbytes=0
