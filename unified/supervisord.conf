[supervisord]
nodaemon=true
user=root
logfile=/app/data/unified-supervisord.log
logfile_maxbytes=0
pidfile=/app/data/unified-supervisord.pid

[program:snapserver]
command=/app/unified/snapserver-entrypoint.sh
user=snapcast
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dbus]
command=/usr/bin/dbus-daemon --session
user=snapcast
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:avahi]
command=/bin/sh -c 'sleep 1; exec /usr/sbin/avahi-daemon --no-drop-root --file=/app/unified/avahi-daemon.conf'
user=snapcast
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:shairport]
command=/app/unified/shairport-entrypoint.sh
user=snapcast
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mpd]
command=/bin/sh -c 'while [ ! -p /app/data/dlnafifo ]; do sleep 1; done; exec /usr/bin/mpd --no-daemon /app/unified/mpd.conf'
user=snapcast
umask=0022
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:upmpdcli]
command=/app/unified/upmpdcli-entrypoint.sh
user=snapcast
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=50
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mympd]
command=/bin/sh -c 'while [ ! -S /app/data/dlna/mpd.sock ]; do sleep 1; done; exec /usr/bin/mympd -w /app/data/mympd/work -a /app/data/mympd/cache'
environment=MPD_HOST="/app/data/dlna/mpd.sock",MPD_PORT="6600",MYMPD_HTTP="true",MYMPD_HTTP_HOST="0.0.0.0",MYMPD_HTTP_PORT="1782",MYMPD_SSL="false",MYMPD_LOGLEVEL="4",MYMPD_SCRIPTS_EXTERNAL="false",MYMPD_STICKERS="false",MYMPD_WEBRADIODB="false"
user=snapcast
umask=0022
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=45
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:control]
command=/usr/bin/python3 /app/control/app.py
environment=CONTROL_PORT="1781",SNAPSERVER_RPC_URL="http://127.0.0.1:1780/jsonrpc",MPD_SOCKET="/app/data/dlna/mpd.sock",AIRPLAY_STOP_HELPER="/app/unified/drop-airplay-session.sh"
user=snapcast
umask=0022
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=50
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
