services:
  snapcast:
    build:
      context: .
      dockerfile: unified/Dockerfile
    image: snapcast-all-in-one:local
    container_name: snapcast
    hostname: snapcast-gateway
    user: "0:0"
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1001}
      GATEWAY_IP: ${GATEWAY_IP:?copy .env.example to .env and set GATEWAY_IP}
      CONTROL_AUTH_ENABLED: ${CONTROL_AUTH_ENABLED:-true}
      CONTROL_USERNAME: ${CONTROL_USERNAME:-admin}
      CONTROL_PASSWORD: ${CONTROL_PASSWORD:-}
      CONTROL_SESSION_TTL: ${CONTROL_SESSION_TTL:-43200}
    volumes:
      - /vol1/1000/tools/snapcast/config:/app/config
      - /vol1/1000/tools/snapcast/data:/app/data
      - /vol1/1000/tools/snapcast/certs:/app/certs
      - /vol1/1000:/media:ro
    networks:
      audio_lan:
        interface_name: eth0
        ipv4_address: ${GATEWAY_IP:?copy .env.example to .env and set GATEWAY_IP}
    healthcheck:
      test: ["CMD", "/bin/sh", "/app/unified/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  audio_lan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:?set MACVLAN_PARENT in .env}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:?set LAN_SUBNET in .env}
          gateway: ${LAN_GATEWAY:?set LAN_GATEWAY in .env}
