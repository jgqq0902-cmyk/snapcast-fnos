name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest control.test_app -q
      - run: python -m unittest unified.test_dlna_relay -v
      - run: python -m py_compile control/app.py unified/*.py

  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check all ES modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find control/static -type f -name '*.js' -print | sort)

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Build image
        run: docker compose build

  docker-smoke-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare empty certificate mount
        run: mkdir -p .ci-certs
      - name: Build and start HTTP runtime
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180
      - name: Run HTTP smoke test
        run: docker compose -f docker-compose.ci.yml exec -T snapcast /app/unified/smoke-test.sh
      - name: Collect service logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color
      - name: Stop runtime
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  docker-smoke-https:
    runs-on: ubuntu-latest
    env:
      WEB_TLS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI certificate
        run: |
          mkdir -p .ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .ci-certs/privkey.pem -out .ci-certs/fullchain.pem \
            -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          chmod 0644 .ci-certs/fullchain.pem .ci-certs/privkey.pem
      - name: Build and start HTTPS runtime
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180
      - name: Run HTTPS smoke test
        run: docker compose -f docker-compose.ci.yml exec -T snapcast /app/unified/smoke-test.sh
      - name: Collect service logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color
      - name: Stop runtime
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
